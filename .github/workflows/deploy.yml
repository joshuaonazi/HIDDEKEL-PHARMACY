name: Deploy to the server

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the website
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Set up the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/ci_key
          chmod 600 ~/.ssh/ci_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server code goes first, because the new screens may need it
      - name: Update the API
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          tar --exclude=node_modules --exclude=.env -czf - -C server . \
            | ssh -i ~/.ssh/ci_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST" api

      - name: Update the website
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          tar -czf - -C client/dist . \
            | ssh -i ~/.ssh/ci_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST" site

      - name: Check the live site
        run: |
          sleep 5
          curl -fsS https://hiddekkelpharmacy.com/api/health